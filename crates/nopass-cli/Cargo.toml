[package]
name = "nopass-cli"
description = "nopass: a fast, self-contained password manager CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nopass"
path = "src/main.rs"

[dependencies]
# The version is what crates.io publishes against; the path is what local
# builds use. Both are needed for `cargo publish` to accept the dependency.
nopass-core = { path = "../nopass-core", version = "0.2.0" }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hmac.workspace = true
libc.workspace = true
rand.workspace = true
sha2.workspace = true
zeroize.workspace = true
ctap-hid-fido2 = { workspace = true, optional = true }

# Where `cargo binstall nopass-cli` looks for the binaries the release
# workflow attaches. Linux builds are musl, so a gnu host is pointed at the
# musl archive rather than told there is nothing for it.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/nopass-{ version }-{ target }.tar.gz"
bin-dir = "nopass-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/nopass-{ version }-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "nopass-{ version }-x86_64-unknown-linux-musl/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/nopass-{ version }-aarch64-unknown-linux-musl.tar.gz"
bin-dir = "nopass-{ version }-aarch64-unknown-linux-musl/{ bin }{ binary-ext }"

[features]
default = []
# FIDO2 security key (passkey) unlock slot, over USB HID. Off by default
# because it pulls in a C HID stack (libudev on Linux); the passphrase slot
# works without it.
security-key = ["dep:ctap-hid-fido2"]

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
