[package]
name = "nopass-cli"
description = "nopass: a fast, self-contained password manager CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nopass"
path = "src/main.rs"

[dependencies]
nopass-core = { path = "../nopass-core" }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hmac.workspace = true
rand.workspace = true
sha2.workspace = true
ctap-hid-fido2 = { workspace = true, optional = true }

[features]
default = []
# FIDO2 security key (passkey) unlock slot, over USB HID. Off by default
# because it pulls in a C HID stack (libudev on Linux); the passphrase slot
# works without it.
security-key = ["dep:ctap-hid-fido2"]

# Touch ID (Secure Enclave) unlock slot. Always compiled on macOS; whether
# it works at runtime depends on the binary being code-signed with keychain
# entitlements — see packaging/macos.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
