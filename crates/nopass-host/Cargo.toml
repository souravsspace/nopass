[package]
name = "nopass-host"
description = "Native messaging host that lets the nopass browser extension read the store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nopass_host"
path = "src/lib.rs"

[[bin]]
name = "nopass-host"
path = "src/main.rs"

[dependencies]
nopass-core = { path = "../nopass-core", version = "0.2.1" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
