<!doctype html>
<meta charset="utf-8" />
<title>Two-step sign in — nopass demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/demo.css" />
<main>
  <h1>Sign in</h1>
  <p>The password box appears only after the account name, the way Google and Microsoft ask.</p>
  <form action="/done.html" method="get" id="form">
    <div id="step-one">
      <label for="identifier">Email</label>
      <input id="identifier" name="identifier" type="email" />
      <button id="next" type="button">Next</button>
    </div>
    <div hidden id="step-two">
      <label for="password">Password</label>
      <input autocomplete="current-password" id="password" name="password" type="password" />
      <button type="submit">Sign in</button>
    </div>
  </form>
</main>
<script>
  document.querySelector("#next").addEventListener("click", () => {
    document.querySelector("#step-one").hidden = true;
    document.querySelector("#step-two").hidden = false;
    document.querySelector("#password").focus();
  });
</script>
