# Builds and publishes the marketing site.
#
# Static output, so there is nothing to run in production — the artifact is a
# directory of files. Deployment is skipped until Pages is enabled for the
# repository, so this workflow is green from its first run and starts
# publishing the moment the setting is turned on.
name: site

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@nopass/web
      - uses: actions/configure-pages@v5
        continue-on-error: true
        id: pages
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        continue-on-error: true
        id: deploy
