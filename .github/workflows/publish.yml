# Pushes a tagged version out to the package channels that can be automated:
# crates.io, the Homebrew tap, the AUR, and COPR. Each job is skipped when
# its secret is missing, so this workflow is green from the first run and
# starts publishing a channel the moment you add its credential.
#
# nixpkgs is not here on purpose: it lands through a pull request, and once
# merged its own update bot handles later versions. See packaging/README.md.
#
# Runs when a v* tag is pushed, and only if that tag is on main.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.2.1"
        required: true

jobs:
  # A tag can point at any commit in the repository. Publishing one that
  # never reached main would ship code nobody reviewed, so refuse it.
  guard:
    name: tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tag is an ancestor of main
        run: |
          git fetch --no-tags origin main
          sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main — refusing to publish"
            exit 1
          fi

  crates:
    name: crates.io
    needs: guard
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Order matters: nopass-cli depends on nopass-core, and crates.io will
      # not accept the dependent until the dependency is indexed. cargo
      # publish waits for the index on its own.
      - name: Publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          for crate in nopass-core nopass-cli; do
            if curl -fsS -o /dev/null "https://crates.io/api/v1/crates/${crate}/${version}"; then
              echo "${crate} ${version} is already published"
              continue
            fi
            cargo publish --package "$crate" --locked
          done

  homebrew:
    name: homebrew tap
    needs: guard
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Update the formula in souravsspace/homebrew-tap
        if: env.TAP_TOKEN != ''
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)

          formula=packaging/homebrew/nopass.rb
          sed -i "s|archive/refs/tags/v[^\"]*\.tar\.gz|archive/refs/tags/${tag}.tar.gz|" "$formula"
          sed -i "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" "$formula"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/souravsspace/homebrew-tap.git" tap
          cp "$formula" tap/Formula/nopass.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || {
            git commit -am "Point the formula at ${tag}"
            git push
          }

  aur:
    name: aur
    needs: guard
    runs-on: ubuntu-latest
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Push PKGBUILD and .SRCINFO to the AUR
        if: env.AUR_SSH_KEY != ''
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)

          # .SRCINFO is normally generated by makepkg, which only exists on
          # Arch. Both files carry the same two facts, so rewrite both.
          sed -i -e "s|^pkgver=.*|pkgver=${version}|" \
                 -e "s|^sha256sums=('.*')|sha256sums=('${sha}')|" \
                 packaging/aur/PKGBUILD
          sed -i -e "s|^\tpkgver = .*|\tpkgver = ${version}|" \
                 -e "s|^\tsource = .*|\tsource = nopass-${version}.tar.gz::${url}|" \
                 -e "s|^\tsha256sums = .*|\tsha256sums = ${sha}|" \
                 packaging/aur/.SRCINFO

          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"

          git clone ssh://aur@aur.archlinux.org/nopass.git aur
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur/
          cd aur
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || {
            git commit -am "Update to ${version}"
            git push
          }

  copr:
    name: copr
    needs: guard
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
    steps:
      # No checkout: COPR clones the tag itself. The spec it finds there is
      # the one that ships, so bump packaging/rpm/nopass.spec before tagging.
      - name: Build the rpm in COPR
        if: env.COPR_CONFIG != ''
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          dnf install -y copr-cli

          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr

          # --nowait: a build across every chroot outlives a sensible CI job.
          # Watch it at copr.fedorainfracloud.org/coprs/souravsspace/nopass.
          copr-cli buildscm --nowait \
            --clone-url "https://github.com/${{ github.repository }}.git" \
            --commit "$tag" \
            --spec packaging/rpm/nopass.spec \
            --type git \
            --method rpkg \
            souravsspace/nopass
