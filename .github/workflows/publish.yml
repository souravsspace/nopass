# Pushes a tagged version out to the package channels that can be automated:
# crates.io, npm, and the Homebrew tap. Each job is skipped when its secret
# is missing, so this workflow is green from the first run and starts
# publishing a channel the moment you add its credential.
#
# nixpkgs is not here on purpose: it lands through a pull request, and once
# merged its own update bot handles later versions. See packaging/README.md.
#
# Runs when a v* tag is pushed, and only if that tag is on main.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.2.1"
        required: true

jobs:
  # A tag can point at any commit in the repository. Publishing one that
  # never reached main would ship code nobody reviewed, so refuse it.
  guard:
    name: tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tag is an ancestor of main
        run: |
          git fetch --no-tags origin main
          sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main — refusing to publish"
            exit 1
          fi

  crates:
    name: crates.io
    needs: guard
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Order matters: nopass-cli depends on nopass-core, and crates.io will
      # not accept the dependent until the dependency is indexed. cargo
      # publish waits for the index on its own.
      - name: Publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # crates.io answers 403 to a request without a descriptive
          # User-Agent, which would look exactly like "not published yet".
          ua="nopass-release (https://github.com/${{ github.repository }})"
          for crate in nopass-core nopass-cli; do
            if curl -fsS -A "$ua" -o /dev/null "https://crates.io/api/v1/crates/${crate}/${version}"; then
              echo "${crate} ${version} is already published"
              continue
            fi
            cargo publish --package "$crate" --locked
          done

  homebrew:
    name: homebrew tap
    needs: guard
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Update the formula in souravsspace/homebrew-tap
        if: env.TAP_TOKEN != ''
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)

          formula=packaging/homebrew/nopass.rb
          sed -i "s|archive/refs/tags/v[^\"]*\.tar\.gz|archive/refs/tags/${tag}.tar.gz|" "$formula"
          sed -i "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" "$formula"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/souravsspace/homebrew-tap.git" tap
          cp "$formula" tap/Formula/nopass.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || {
            git commit -am "Point the formula at ${tag}"
            git push
          }

  npm:
    name: npm
    # The package downloads a binary from the release, so the release has to
    # have one by the time anyone installs it.
    needs: guard
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Publishing an old tag by hand reaches a commit from before the npm
      # package existed. Nothing to do there, and it is not a failure.
      - name: Is there an npm package at this tag?
        id: pkg
        run: |
          if [ -d packaging/npm ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "packaging/npm does not exist at this tag — nothing to publish"
          fi

      # The package is useless until release.yml has attached the binaries it
      # downloads, and that is a different workflow. Wait for them rather
      # than publish something that cannot install.
      - name: Wait for the release binaries
        if: env.NPM_TOKEN != '' && steps.pkg.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          for _ in $(seq 60); do
            missing=0
            for t in x86_64-apple-darwin aarch64-apple-darwin \
                     x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
              gh release view "$tag" --repo "${{ github.repository }}" \
                --json assets --jq '.assets[].name' 2>/dev/null |
                grep -qx "nopass-${version}-${t}.tar.gz" || missing=1
            done
            [ "$missing" = 0 ] && exit 0
            sleep 30
          done
          echo "::error::the release binaries for $tag never showed up"
          exit 1

      - name: Publish
        if: env.NPM_TOKEN != '' && steps.pkg.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          cd packaging/npm
          npm version "$version" --no-git-tag-version --allow-same-version
          if npm view "nopass-cli@${version}" version >/dev/null 2>&1; then
            echo "nopass-cli ${version} is already published"
            exit 0
          fi
          npm publish --access public
