name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The host's contract tests read packages/protocol/fixtures, so this job
      # is what catches a wire change made on the JavaScript side only.
      - run: cargo test --workspace

  javascript:
    name: bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bunx turbo run lint check-types test

  extensions:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@nopass/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nopass-${{ matrix.target }}
          path: tools/${{ matrix.target }}/.output/
          if-no-files-found: error

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: tools/workbench
      - run: bun run e2e
        working-directory: tools/workbench
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tools/workbench/playwright-report/
          retention-days: 7
