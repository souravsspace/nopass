[workspace]
resolver = "2"
members = ["crates/nopass-core", "crates/nopass-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/souravsspace/nopass"

[workspace.dependencies]
age = "0.11"
base64 = "0.21"
ctap-hid-fido2 = "3.5"
hmac = "0.12"
libc = "0.2"
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
walkdir = "2"
zeroize = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
